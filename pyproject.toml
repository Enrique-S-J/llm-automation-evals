[build-system]
# 77 is the first setuptools that reads `license` as an SPDX string. The older
# table form still builds but is deprecated and scheduled for removal.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-automation-evals"
version = "0.1.0"
description = "A small eval harness for LLM-powered automations: golden test cases, pluggable scorers, regression reports, and safe-failure checks, with a worked example for ticket classification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enrique Sanchez" }]
keywords = ["llm-evals", "evaluation", "llmops", "ai-agents", "testing", "ai-quality"]
dependencies = [
    # Plain HTTP against the OpenAI-compatible chat completions route, so the
    # same suite runs against any server that speaks it. No vendor SDK.
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.18,<5",
    # jsonschema's own dependency, imported directly to resolve every $ref in
    # an output schema when the suite is loaded. The floor is jsonschema's.
    "referencing>=0.28.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Enrique-S-J/llm-automation-evals"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
